m Tiptap block schema with journalism-specific content types: timelines, document viewers, data tables, annotatable excerpts, pull quotes, and map embeds. Each block type is extensible and serializes to clean JSON."},{h:"Deployment",p:"Chronicle supports Vercel, Railway, Fly.io, and any Docker-compatible host. ISR (Incremental Static Regeneration) is configured by default — short pieces rebuild on every publish, long investigations rebuild on a 60-second revalidation."}]},changelog:{title:"Changelog",sections:[{h:"v2.4.0 — June 2026",p:"Added collaborative cursor presence, improved timeline block rendering on mobile, and shipped the new annotation sidebar for the reader experience."},{h:"v2.3.0 — May 2026",p:"Paywall integration with Stripe, metered access configuration in admin, and newsletter gate component with customizable scroll-depth trigger."},{h:"v2.2.0 — April 2026",p:"Document viewer now supports multi-page PDF rendering with zoom controls, highlight persistence, and shared annotation threads."}]},api:{title:"API Reference",sections:[{h:"Authentication",p:"All API requests require a Bearer token. Generate tokens from Settings → API Keys. Tokens are scoped to read, write, or admin permissions."},{h:"Stories endpoint",p:"GET /api/stories returns paginated story metadata. POST /api/stories creates a new draft. PUT /api/stories/:id updates content blocks. DELETE /api/stories/:id moves a story to trash."},{h:"Blocks endpoint",p:"GET /api/stories/:id/blocks returns the full block tree. POST /api/stories/:id/blocks appends a new block. PATCH /api/stories/:id/blocks/:blockId updates a single block in place."}]},github:{title:"GitHub Repository",sections:[{h:"Open-source under MIT",p:"Chronicle is fully open-source. The repository contains the Next.js application, the Tiptap editor extensions, the reader experience components, and all database migrations."},{h:"Contributing",p:"We welcome contributions. Fork the repo, create a feature branch, write tests, and open a pull request. All PRs require at least one review from a core maintainer."},{h:"Issue tracker",p:"Bug reports and feature requests are tracked on GitHub Issues. Use the provided templates — they help us triage faster and ship fixes sooner."}]},about:{title:"About Chronicle",sections:[{h:"Why we built this",p:"Existing CMS tools treat journalism like blog posts. Chronicle was designed from the ground up for investigative teams — structured story management, embedded primary sources, collaborative workflows, and a reading experience that respects 20,000-word investigations."},{h:"The team",p:"Chronicle is maintained by a small team of journalists and engineers who have worked in newsrooms and understand the editorial workflow. We build tools we want to use ourselves."},{h:"Open-source philosophy",p:"Journalism infrastructure should not be owned by any single company. Chronicle is MIT-licensed, self-hostable, and designed so that newsrooms retain full control of their content and data."}]},blog:{title:"Blog",sections:[{h:"Building a CMS that journalists actually want to use",p:"Most CMS tools are built for marketers. We interviewed 40 investigative journalists across 12 newsrooms to understand what they actually need — and built Chronicle around those conversations."},{h:"How we handle 20,000-word articles at scale",p:"ISR, progressive hydration, and block-level lazy loading let Chronicle serve massive investigations in under 2 seconds. Here's how the architecture works under the hood."},{h:"The annotation system: design decisions",p:"Inline footnotes, margin annotations, and collaborative highlights all need to coexist without visual clutter. This post explains the design trade-offs we made."}]},careers:{title:"Careers",sections:[{h:"We're hiring",p:"Chronicle is looking for frontend engineers (React, Tiptap), backend engineers (Node, Postgres), and a product designer with editorial experience. Remote-first, async-friendly."},{h:"How we work",p:"Small team, high tru
